_target_: src.dp_tdf.dp_tdf_net.DPTDFNet

# abstract parent class
target_name: 'bass'
lr: 0.0001
optimizer: adamW

dim_f: 864
dim_t: 256
n_fft: 8192
n_fft_short: 6144
n_fft_long: 12288
hop_length: 1024
overlap: 4096

audio_ch: 2

block_type: TFC_TDF_Res2
num_blocks: 5
l: 3
g: 32
k: 3
bn: 2
bias: False
bn_norm: BN
bandsequence:
  rnn_type: LSTM
  bidirectional: True
  num_layers: 4
  n_heads: 2

mr_frontend:
  num_branch_layers: 2  #每一路分支两层卷积块
  weight_hidden_dim: 128  #权重网络隐藏层128
  align_mode: bilinear  #对齐方式bilinear